<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나는 어떻게 만들어졌을까?</title>
<style>
:root{
  --bg:#FBF6EC;--ink:#3D3229;--sub:#7A6D61;--card:#FFFFFF;--line:#E8DFD0;
  --accent:#E07A5F;--accent-d:#C3624A;
  --blue:#4A8FD9;--blue-l:#E4F0FC;--yellow:#E0A820;--yellow-l:#FFF3D1;
  --purple:#7A55C0;--purple-l:#EDE5FA;--lpurple:#B9A3E3;--lpurple-l:#F8F4FE;
  --green:#4FA866;--green-l:#E2F4E6;
  --coral:#EE8866;--coral-l:#FDE9E1;--gray:#A89C8E;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent}
#app{max-width:1080px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px}
.hright{display:flex;align-items:center;gap:12px}
.progress{display:flex;gap:5px}
.progress span{width:18px;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.progress span.done{background:#EDB9A9}
.progress span.on{background:var(--accent)}
.badge{background:var(--yellow-l);color:#8A6400;border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px}
main{flex:1;display:flex;flex-direction:column;padding-top:6px}
main.enter{animation:fadeUp .45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
.rise{opacity:0;animation:fadeUp .5s ease forwards}
h1.q{font-size:28px;margin:10px 0 6px;line-height:1.35}
.center{text-align:center}
p.hint{color:var(--sub);margin:0 0 18px;font-size:17px;line-height:1.5}
.btn{border:none;border-radius:999px;padding:13px 26px;font-size:18px;font-weight:800;cursor:pointer;min-height:52px;font-family:inherit;transition:transform .15s, filter .15s}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-d)}
.btn.primary:disabled{background:#D9CFC2;box-shadow:0 4px 0 #C4B8A9;cursor:default;transform:none;filter:none}
.btn.ghost{background:transparent;color:var(--sub);border:2px solid var(--line)}
.btn.soft{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.soft:active,.btn.ghost:active{transform:translateY(2px)}
.btn.big{font-size:22px;padding:16px 40px}
.btn.small{min-height:48px;padding:10px 20px;font-size:16px}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:20px 0 26px;margin-top:auto;gap:12px;flex-wrap:wrap}

/* chips */
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:16px;background:#fff;
  border:2px solid var(--line);font-size:17px;cursor:pointer;min-height:52px;font-family:inherit;color:var(--ink);text-align:left;line-height:1.35;transition:transform .15s, box-shadow .15s}
.chip .em{font-size:24px}
.chip.sel{border-color:var(--accent);background:var(--coral-l);font-weight:800}
.chip.sel-y{border-color:var(--yellow);background:var(--yellow-l);font-weight:800}
.chip.sel-g{border-color:var(--green);background:var(--green-l);font-weight:800}
.chip.sel-a{border-color:var(--gray);background:#F4EFE7;font-weight:800;border-style:dashed}
.chip:disabled{opacity:.45;cursor:default}
.justsel{animation:selpop .32s ease}
@keyframes selpop{0%{transform:scale(.95)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (hover:hover){
  .chip:not(:disabled):hover,.x-card:not(:disabled):hover,.dom-tile:hover,.opt:hover,.tab:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(80,60,40,.10)}
  .btn.primary:not(:disabled):hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn.soft:hover,.btn.ghost:hover{transform:translateY(-1px)}
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--sub);min-height:46px;transition:transform .15s}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.custom{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.custom input,.mine input{flex:1;min-width:200px;font-size:18px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);font-family:inherit;min-height:52px;background:#fff;color:var(--ink)}
.custom input:focus,.mine input:focus{outline:none;border-color:var(--accent)}
.tray{margin-top:18px;background:#fff;border:2px dashed var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:70px}
.tray b{color:var(--sub);margin-right:6px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--coral-l);border:2px solid var(--coral);border-radius:999px;padding:6px 8px 6px 14px;font-weight:700;animation:selpop .3s ease}
.tag button{border:none;background:#fff;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--sub)}

/* domains & cards */
.domains{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.dom-tile{background:#fff;border:3px solid var(--line);border-radius:20px;padding:18px 12px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .15s, box-shadow .15s;position:relative}
.dom-tile .e{font-size:44px;display:block}
.dom-tile .n{font-size:20px;font-weight:800;display:block;margin-top:6px}
.dom-tile .d{font-size:14px;color:var(--sub);display:block;margin-top:4px}
.dom-tile .again{position:absolute;top:8px;right:8px;background:var(--blue-l);color:#23609F;font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px}
.dom-tile.sel{border-color:var(--blue);background:var(--blue-l)}
.sec-title{font-size:18px;font-weight:800;margin:24px 0 10px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.x-card{background:#fff;border:3px solid var(--line);border-radius:18px;padding:16px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);display:flex;gap:12px;align-items:flex-start;transition:transform .15s, box-shadow .15s}
.x-card .e{font-size:36px}
.x-card .t{font-weight:800;font-size:18px;display:block}
.x-card .d{color:var(--sub);font-size:15px;display:block;margin-top:4px;line-height:1.4}
.x-card.sel{border-color:var(--yellow);background:var(--yellow-l)}
.x-card:disabled{opacity:.45;cursor:default}
@media (max-width:760px){.domains{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}}

/* pills */
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;border:2px solid}
.pill.blue{background:var(--blue-l);border-color:var(--blue);color:#23609F}
.pill.yellow{background:var(--yellow-l);border-color:var(--yellow);color:#8A6400}
.pill.purple{background:var(--purple-l);border-color:var(--purple);color:#4F3391}
.pill.lpurple{background:var(--lpurple-l);border-color:var(--lpurple);color:#6A55A0}
.pill.green{background:var(--green-l);border-color:var(--green);color:#2D7442}
.pill.gray{background:#F4EFE7;border-color:var(--gray);color:var(--sub);border-style:dashed}
.mini-chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px}
.mini-chain .arr{color:var(--gray);font-weight:800}

/* situation */
.sentence{background:#fff;border-radius:20px;padding:20px 24px;font-size:24px;line-height:1.9;border:2px solid var(--line)}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--yellow);color:#9A7300;padding:0 6px;font-weight:800;text-align:center}
.blank.empty{color:#CDBFAC}
.slot{margin-top:18px}
.slot h3{font-size:17px;color:var(--sub);margin:0 0 8px}
.slot .row{display:flex;flex-wrap:wrap;gap:10px}

/* thought screen: 거울 / 화면 / 경험 카드 */
.mirror-wrap{display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:center}
.mirror-col{display:flex;flex-direction:column;align-items:center;gap:10px}
.label-dark{font-weight:800;color:#4F3391;background:var(--purple-l);border:2px solid var(--purple);border-radius:999px;padding:5px 14px;font-size:15px}
.label-light{font-weight:800;color:#6A55A0;background:var(--lpurple-l);border:2px solid var(--lpurple);border-radius:999px;padding:5px 14px;font-size:15px}
.mirror{width:240px;height:300px;border-radius:120px 120px 26px 26px;background:linear-gradient(160deg,#F3F8FC,#D3E1EE);
  border:12px solid #C9A77C;box-shadow:inset 0 0 30px rgba(255,255,255,.95),0 10px 22px rgba(0,0,0,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;font-size:21px;font-weight:800;position:relative;overflow:hidden;line-height:1.45}
.mirror::after,.screenbox::after{content:"";position:absolute;top:-30%;left:-60%;width:40%;height:160%;background:rgba(255,255,255,.55);transform:rotate(25deg);animation:shine 3.5s ease-in-out infinite}
.screenbox::after{background:rgba(255,255,255,.12)}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.mirror .m-top,.screenbox .m-top,.expbox .m-top{font-size:40px;margin-bottom:8px}
.mirror .m-who,.screenbox .m-who{font-size:15px;color:var(--sub);font-weight:700;margin-top:10px}
.screenbox{width:280px;height:220px;border-radius:22px;background:linear-gradient(160deg,#39425E,#232A3E);border:12px solid #4B4B5A;color:#fff;
  box-shadow:0 10px 22px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:20px;font-weight:800;position:relative;overflow:hidden;line-height:1.45}
.screenbox .m-who{color:#C9CFE0}
.expbox{width:260px;min-height:220px;border-radius:22px;background:var(--yellow-l);border:4px solid var(--yellow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:21px;font-weight:800;line-height:1.45}
.expbox .d{font-size:15px;color:var(--sub);font-weight:600;margin-top:8px}
.cap{font-size:15px;color:var(--sub);max-width:260px;text-align:center}
.opts{display:flex;flex-direction:column;gap:12px;flex:1;min-width:290px;max-width:520px}
.opts > span{align-self:flex-start}
.opt{text-align:left;padding:16px 18px;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:19px;font-family:inherit;cursor:pointer;color:var(--ink);min-height:58px;font-weight:600;transition:transform .15s, box-shadow .15s}
.opt.sel{border-color:var(--lpurple);background:var(--lpurple-l);font-weight:800}
.ask-note{background:#FAF7F2;border:2px dashed var(--gray);border-radius:16px;padding:12px 16px;font-size:17px;color:var(--sub);margin-bottom:16px;line-height:1.55}

/* domino */
.dominos{display:flex;align-items:flex-end;justify-content:center;gap:2px;flex-wrap:wrap;padding:26px 0 10px}
.dom{width:128px;height:172px;border-radius:14px;background:#fff;border:4px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 8px;text-align:center;opacity:0;transform-origin:bottom right;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.dom .e{font-size:38px}
.dom .t{font-size:12px;font-weight:800;margin-top:6px;opacity:.9}
.dom .l{font-size:15px;font-weight:700;margin-top:6px;line-height:1.35;word-break:keep-all}
.dom.dash{border-style:dashed}
.dom.run{animation:domIn .35s ease forwards, domFall .6s ease forwards}
@keyframes domIn{to{opacity:1}}
@keyframes domFall{0%{transform:rotate(0)}30%{box-shadow:0 0 0 8px var(--g), 0 6px 0 rgba(0,0,0,.08);transform:rotate(0) scale(1.06)}
  60%{transform:rotate(17deg)}100%{transform:rotate(8deg);box-shadow:0 6px 0 rgba(0,0,0,.08)}}
.darr{font-size:24px;color:var(--gray);align-self:center;opacity:0;animation:fadeIn .3s forwards;padding:0 3px}
.after{opacity:0;animation:fadeIn .6s forwards}
.msg{font-size:21px;font-weight:800;text-align:center;margin:18px 0 12px}
.more{background:#fff;border:3px solid var(--accent);border-radius:20px;padding:16px 20px;text-align:center;margin-top:16px}
.more h3{margin:0 0 12px;font-size:21px}
.more .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* 사회화 지도 */
.uni{width:100%;height:auto;background:#fff;border-radius:24px;border:2px solid var(--line);display:block}
.nd{cursor:pointer}
.nd.active circle{stroke-width:7}
.pop{transform-box:fill-box;transform-origin:center;opacity:0}
.flt{transform-box:fill-box;transform-origin:center;animation:flt 2.6s ease-in-out infinite alternate}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes flt{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
.edr{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:draw .45s ease forwards}
.edf{opacity:0;animation:fadeIn .45s ease forwards}
@keyframes draw{0%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
.chrw{transform-box:fill-box;transform-origin:50% 100%}
.chrw.hl{animation:chrHL .7s ease}
/* 스틱맨 관절·표정 */
.chr .j{transform-box:view-box;transform-origin:0 0;transition:transform .5s cubic-bezier(.4,1.35,.5,1)}
.fx{opacity:0;transition:opacity .25s}
.chr[data-ex="neutral"] .fx-neutral,.chr[data-ex="think"] .fx-think,.chr[data-ex="surprise"] .fx-surprise,
.chr[data-ex="tilt"] .fx-tilt,.chr[data-ex="happy"] .fx-happy,.chr[data-ex="joy"] .fx-joy{opacity:1}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.chr[data-pose="happy"] .bob{animation:hop .45s ease 2}
.chr[data-pose="surprise"] .bob{animation:jolt .45s ease}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes jolt{0%,100%{transform:translateY(0)}35%{transform:translateY(-10px)}}
.chr[data-pose="wave"] .jrf{animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-75deg)}to{transform:rotate(-25deg)}}
.chr .breath{animation:breath 3.2s ease-in-out infinite}
@keyframes breath{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
.spark{opacity:0;transition:opacity .3s}
.chr[data-ex="joy"] .spark{opacity:1}
.spark text{transform-box:fill-box;transform-origin:center;opacity:0;animation:twinkle var(--d,1.6s) ease-in-out var(--w,0s) infinite}
@keyframes twinkle{0%,100%{transform:scale(.3) rotate(-10deg);opacity:0}35%{transform:scale(1.15) rotate(8deg);opacity:1}60%{transform:scale(.8) rotate(0);opacity:.7}}
.ntag.drop{transform-box:fill-box;transform-origin:center;animation:tagdrop .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes tagdrop{0%{transform:translateY(-90px) scale(1.6) rotate(-14deg);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
/* 안내 스틱맨 */
.headrow{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.headrow .ht{flex:1;min-width:0}
.guide{display:flex;align-items:flex-end;gap:4px;flex-shrink:0}
.gsvg{width:96px;height:142px;overflow:visible}
@media (max-width:700px){.gsvg{width:66px;height:98px}}
/* 이름표 화면 */
.namewrap{display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}
.namesvg{width:260px;height:300px;overflow:visible}
.nameform{flex:1;min-width:280px;max-width:480px}
.nameform input{width:100%;font-size:26px;font-weight:800;padding:14px 18px;border-radius:16px;border:3px solid var(--line);font-family:inherit;text-align:center;background:#fff;color:var(--ink);margin:6px 0 12px}
.nameform input:focus{outline:none;border-color:var(--accent)}
.sndbtn{border:2px solid var(--line);background:#fff;border-radius:999px;min-width:48px;height:40px;font-size:18px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;padding:0 10px;color:var(--sub);font-weight:700}
.sndbtn.on{border-color:var(--accent);background:var(--coral-l);color:var(--accent-d)}
@keyframes chrHL{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 2.8s ease-in-out infinite alternate}
@keyframes halo{from{transform:scale(.96);opacity:.55}to{transform:scale(1.05);opacity:.85}}
.detail{background:#fff;border-radius:16px;padding:14px 18px;border-left:7px solid var(--gray);min-height:56px;margin-top:12px;font-size:18px;line-height:1.55}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--sub);margin-top:12px;justify-content:center}
.legend i{display:inline-block;width:15px;height:15px;border-radius:50%;border:3px solid;margin-right:6px;vertical-align:-3px}

/* boxes */
.box{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px 22px;font-size:19px;line-height:1.65;margin-top:14px}
.box.key{border-color:var(--accent);background:#FFF8F3}
mark{background:linear-gradient(transparent 55%,#FFD9A8 55%);color:inherit;font-weight:800;padding:0 2px}
.yn{display:flex;gap:18px;justify-content:center;margin:24px 0}
.yn .btn{min-width:160px}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;max-width:760px;margin:0 auto;width:100%}
.fstep{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 18px}
.fstep .h{font-weight:800;font-size:18px}
.fstep .items{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fstep .it{background:var(--bg);border-radius:999px;padding:5px 12px;font-size:15px;font-weight:700}
.fdown{text-align:center;color:var(--gray);font-size:22px;font-weight:800;line-height:1.3}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.row2{grid-template-columns:1fr}}

/* cloze (빈칸 복습) */
.cloze{background:#fff;border:3px solid var(--accent);border-radius:22px;padding:18px 22px;margin-top:18px}
.cloze .ch{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--accent-d);margin-bottom:10px}
.cloze .txt{font-size:22px;line-height:2.3}
.cb{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:46px;padding:4px 14px;margin:0 3px;border-radius:12px;
  border:3px dashed #D9CBB6;background:#FBF6EC;color:#BDB1A2;font-size:20px;font-weight:800;font-family:inherit;cursor:pointer;vertical-align:middle}
.cb.filled{border-style:solid;border-color:var(--yellow);background:var(--yellow-l);color:#7A5A00}
.cb.wrong{border-color:#D9534F;background:#FDE4E2;color:#B03A36}
.cb.shk{animation:shake .45s}
.cb.ok{border-style:solid;border-color:var(--green);background:var(--green-l);color:#2D7442;cursor:default}
.cb.rev{border-style:solid;border-color:var(--gray);background:#F4EFE7;color:var(--ink);cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;padding-top:14px;border-top:2px dashed var(--line)}
.bank .chip{font-weight:800}
.bank .chip.usedw{visibility:hidden}
.cfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.cmsg{font-size:17px;font-weight:700;line-height:1.5}
.cmsg.good{color:#2D7442}.cmsg.bad{color:#B03A36}.cmsg.hint{color:#8A6400}.cmsg.rev{color:var(--sub)}


/* sentence */
.sent-prev{background:#fff;border-radius:20px;padding:20px 24px;font-size:22px;line-height:1.95;border:2px solid var(--line)}
.mine{background:#fff;border:2px dashed var(--accent);border-radius:20px;padding:16px 20px;margin-top:22px}
.mine h3{margin:0 0 4px;font-size:19px;color:var(--accent-d)}
.mine label{display:block;font-weight:800;font-size:17px;margin:14px 0 6px}
.mine textarea{width:100%;font-size:18px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);font-family:inherit;min-height:96px;resize:vertical;background:#fff;color:var(--ink);line-height:1.5}
.mine textarea:focus{outline:none;border-color:var(--accent)}
.mine .cnt{font-size:13px;color:var(--sub);text-align:right;margin-top:4px}

/* ending */

function wrapLabel(str, n, maxLines){
  maxLines = maxLines || 3;
  let s = String(str);
  const lines = [];
  while (s.length > n && lines.length < maxLines - 1) {
    let cut = -1;
    for (let i = Math.min(n, s.length - 1); i > 0; i--) { if (s[i] === ' ') { cut = i; break; } }
    if (cut > 1) { lines.push(s.slice(0, cut)); s = s.slice(cut + 1); }
    else { lines.push(s.slice(0, n)); s = s.slice(n); }
  }
  if (s.length > n + 1) s = s.slice(0, n) + '…';
  lines.push(s);
  return lines;
}

function mkEdge(x1, y1, r1, x2, y2, r2, dash, arrow){
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  const pad = arrow ? 3 : 0;
  return {sx:x1 + ux * r1, sy:y1 + uy * r1, ex:x2 - ux * (r2 + pad), ey:y2 - uy * (r2 + pad), dash:!!dash, arrow:arrow !== false};
}
function chainNodes(ch, k, y){
  const d = dom(ch), c = card(ch), t = thoughtOpt(ch), g = changeOpt(ch);
  const all = {
    0:{tier:'src', emoji:d.emoji, label:d.name, detail:`경험 ${k + 1}이 있었던 곳: ${d.name}`},
    1:{tier:'act', emoji:c.emoji, label:c.title, detail:expText(ch)},
    2:hasReact(ch) ? {tier:'rea', emoji:reactEmoji(ch), label:reactLabel(ch),
        detail:isMedia(ch) ? `${val(ch, 'content')}에서 ${sceneShort(ch)}을 보았어요.` : `${whoShort(ch)}의 반응: “${val(ch, 'say')}”`} : null,
    3:t ? {tier:'mir', emoji:thoughtEmoji(ch), label:t.short,
        detail:isMirror(ch) ? `다른 사람의 반응을 거울삼아 이렇게 생각했어요: “${t.text}”` : `나는 이렇게 생각했어요: “${t.text}”`} : null,

  };
  return COLS_BY_DEPTH[ch.depth].map(col => Object.assign({}, all[col], {id:`c${k}n${col}`, col, x:COLX[col], y, chain:k}));
}
/* opts.final: 완성된 경험만 보여 줌 / 아니면 upto 이전 경험 + 빈 줄 */
function buildScene(opts){
  opts = opts || {};
  const rows = [], empty = [];
  if (opts.final) {
    const list = S.chains.slice(0, S.used).map((ch, k) => ({ch, k})).filter(o => chainComplete(o.ch));
    const ys = ROWS_FOR[Math.max(1, list.length)];
    list.forEach((o, i) => rows.push({ch:o.ch, k:o.k, y:ys[i]}));
  } else {
    const upto = opts.upto == null ? NUM_CHAINS : opts.upto;
    const ys = ROWS_FOR[3];
    S.chains.forEach((ch, k) => {
      if (k < upto && chainComplete(ch)) rows.push({ch, k, y:ys[k]});
      else empty.push({k, y:ys[k], cols:COLS_BY_DEPTH[ch.depth]});
    });
  }
  const nodes = [], edges = [], resNodes = [];
  rows.forEach(r => {
    const ns = chainNodes(r.ch, r.k, r.y);
    ns.forEach((n, i) => {
      nodes.push(n);
      if (i > 0) edges.push(mkEdge(ns[i - 1].x, r.y, 30, n.x, r.y, 30, false, true));
    });
    const last = ns[ns.length - 1];
    edges.push(Object.assign(mkEdge(last.x, r.y, 30, CHX, CCY, 100, last.tier === 'ask', true), {toChar:true}));
  });
  const slots = RES_SLOTS[S.now.length] || [];
  S.now.forEach((it, i) => {
    const [x, y] = slots[i];
    resNodes.push({id:'now' + i, x, y, emoji:it.emoji, label:it.label, tier:'now', detail:`현재의 나를 이루는 것: ${it.label}`});
    // 위쪽 아이콘은 이름표 아래에서 화살표가 멈추도록
    const r2 = y < CCY - 60 ? (Math.abs(x - CHX) < 40 ? 74 : 58) : 30;
    edges.push(Object.assign(mkEdge(CHX, CCY, 100, x, y, r2, false, true), {toRes:true}));
  });
  const pe = opts.final ? ['open','joy'] : countPose(rows.length);
  return {nodes, resNodes, edges, empty, pose:pe[0], ex:pe[1], rows};
}

    <rect class="ntag-r" x="${-w / 2}" y="63" width="${w}" height="21" rx="6" fill="#fff" stroke="#EE8866" stroke-width="2.5" ${ghost ? 'stroke-dasharray="4 3"' : ''}/>
    <text class="ntag-t" x="0" y="78.5" text-anchor="middle" font-size="13" font-weight="800" fill="#C3624A">${esc(nm)}</text></g>`;
}
/* o: {x, y, s, pose, ex, name, tagState, steps, hl, hlDelay} */
function charSVG(o){
  o = o || {};
  const st = `stroke="${INK}" stroke-width="5" stroke-linecap="round" fill="none"`;
  const seg = len => `<line x1="0" y1="0" x2="0" y2="${len}" ${st}/>`;
  let g = `<g transform="translate(${o.x || 0},${o.y || 0}) scale(${o.s || 1})">`;
  g += `<g class="chrw ${o.hl ? 'hl' : ''}" ${o.hlDelay != null ? `style="animation-delay:${o.hlDelay}s"` : ''}>`;
  g += `<g class="chr" data-pose="${o.pose || 'idle'}" data-ex="${o.ex || 'neutral'}" ${o.steps ? `data-steps="${o.steps}"` : ''}><g class="bob"><g class="breath">`;
  g += `<g transform="translate(0,100)"><g class="j jll">${seg(54)}</g></g><g transform="translate(0,100)"><g class="j jrl">${seg(54)}</g></g>`;
  g += `<line x1="0" y1="30" x2="0" y2="100" ${st}/>`;
  g += `<g transform="translate(0,50)"><g class="j jlu">${seg(28)}<g transform="translate(0,28)"><g class="j jlf">${seg(26)}</g></g></g></g>`;
  g += `<g transform="translate(0,50)"><g class="j jru">${seg(28)}<g transform="translate(0,28)"><g class="j jrf">${seg(26)}</g></g></g></g>`;
  if (o.name != null) g += tagSVG(o.name, o.tagState);
  g += `<g transform="translate(0,32)"><g class="j jh"><g transform="translate(0,-32)"><circle cx="0" cy="0" r="32" fill="#FFE3C8" stroke="${INK}" stroke-width="5"/>${FACE_SVG}</g></g></g>`;
  g += SPARK_SVG;
  g += `</g></g></g></g></g>`;
  return g;
}

function guideHTML(pose, ex, line){

function nodeSVG(nd, cls, style){

  const t = TIER[nd.tier];

/* opts.pop: {id:delay} 개별 등장 / opts.seq: 최종 지도 순차 등장 연출 */
function sceneSVG(sc, opts){
  opts = opts || {};
  const pop = opts.pop || {};
  const seq = !!opts.seq;
  let s = `<svg class="uni" viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="나의 사회화 지도" __SFX__>`;
  s += `<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B7AB9C"/></marker></defs>`;
  // 열 제목
  COL_HEAD.forEach((lines, i) => {
    const t = TIER[COL_TIER[i]];
    lines.forEach((ln, j) => {
      s += `<text x="${COLX[i]}" y="${lines.length === 1 ? 64 : 53 + j * 20}" text-anchor="middle" font-size="15" font-weight="800" fill="${t.c === '#B9A3E3' ? '#8C73C8' : t.c}">${ln}</text>`;
    });
  });
  s += `<line x1="30" y1="90" x2="585" y2="90" stroke="#F0E8DB" stroke-width="2"/>`;
  // 줄 번호
  sc.rows.forEach(r => {
    s += `<circle cx="22" cy="${r.y}" r="13" fill="#F4EFE7"/><text x="22" y="${r.y + 1}" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="800" fill="#7A6D61">${r.k + 1}</text>`;
  });
  // 빈 줄 (아직 찾지 않은 경험)
  sc.empty.forEach(e => {
    s += `<circle cx="22" cy="${e.y}" r="13" fill="#F7F2EA"/><text x="22" y="${e.y + 1}" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="800" fill="#C8BCAE">${e.k + 1}</text>`;
    s += `<line x1="${COLX[e.cols[0]]}" y1="${e.y}" x2="${COLX[e.cols[e.cols.length - 1]]}" y2="${e.y}" stroke="#EFE7DA" stroke-width="3" stroke-dasharray="6 8"/>`;
    e.cols.forEach(c => { s += `<circle cx="${COLX[c]}" cy="${e.y}" r="26" fill="#FFFFFF" stroke="#E8DFD0" stroke-width="3" stroke-dasharray="6 5"/>`; });
    s += `<text x="${COLX[2]}" y="${e.y + 50}" text-anchor="middle" font-size="14" font-weight="700" fill="#BDB1A2">${ROW_PH[e.k]} 찾으면 채워져요</text>`;
  });
  // 순차 연출 시간 계산
  let t = .15;
  const nodeDelay = {};
  if (seq) sc.nodes.forEach(n => { nodeDelay[n.id] = t; t += .09; });
  const tEdge = t + .05, tChar = tEdge + .5, tRes = tChar + .45;
  // 연결선
  sc.edges.forEach(e => {
    const attrs = `x1="${e.sx.toFixed(1)}" y1="${e.sy.toFixed(1)}" x2="${e.ex.toFixed(1)}" y2="${e.ey.toFixed(1)}" stroke="#C9BEAF" stroke-width="3.5" ${e.arrow ? 'marker-end="url(#ah)"' : ''}`;
    if (seq) {
      const d = e.toRes ? tRes : tEdge;
      s += e.dash
        ? `<line ${attrs} stroke-dasharray="8 7" class="edf" style="animation-delay:${d}s"/>`
        : `<line ${attrs} pathLength="1" class="edr" style="animation-delay:${d}s"/>`;
    } else {
      s += `<line ${attrs} ${e.dash ? 'stroke-dasharray="8 7"' : ''}/>`;
    }
  });
  const chSteps = opts.steps || (seq ? `hips,happy,0;open,joy,${tChar.toFixed(2)}` : '');
  s += `<circle class="halo" cx="${CHX}" cy="${CHY + 68}" r="98" fill="#FDE9E1"/>`;
  s += charSVG({x:CHX, y:CHY, pose:sc.pose, ex:sc.ex, name:S.name || null, steps:chSteps, hl:seq, hlDelay:seq ? tChar : null});
  s += `<text x="${CHX}" y="${CHY + 184}" text-anchor="middle" font-size="19" font-weight="800" fill="#C3624A">현재의 나</text>`;
  sc.nodes.forEach(nd => {
    const d = seq ? nodeDelay[nd.id] : pop[nd.id];
    s += nodeSVG(nd, d != null ? 'pop' : '', d != null ? `animation:pop .45s cubic-bezier(.3,1.6,.5,1) ${d}s forwards` : '');
  });
  // 현재의 나를 이루는 것: 캐릭터 주변에 떠 있음
  sc.resNodes.forEach((nd, i) => {
    const d = seq ? tRes + .15 + i * .15 : pop[nd.id];
    const fl = `flt 2.6s ease-in-out ${((d || 0) + .45 + i * .3).toFixed(2)}s infinite alternate`;
    s += d != null
      ? nodeSVG(nd, 'pop', `animation:pop .45s cubic-bezier(.3,1.6,.5,1) ${d}s forwards, ${fl}`)
      : nodeSVG(nd, 'flt', `animation:${fl}`);
  });
  s += `</svg>`;
  const sfxAttr = opts.sfx ? `data-sfx="${opts.sfx.includes('@') ? opts.sfx : `${opts.sfx}@${(tChar + .05).toFixed(2)}`}"` : '';
  return s.replace('__SFX__', sfxAttr);
}

/* 지금까지 고른 흐름을 알약으로 표시 (stage: 1=경험까지, 2=반응까지, 3=생각까지, 4=변화까지) */
function chainPills(ch, stage){
  const d = dom(ch), c = card(ch), t = thoughtOpt(ch), g = changeOpt(ch);
  const parts = [];
  if (d) parts.push(`<span class="pill blue">${d.emoji} ${esc(d.name)}</span>`);
  if (c && stage >= 1) parts.push(`<span class="pill yellow">${c.emoji} ${esc(c.title)}</span>`);
  if (c && stage >= 2 && hasReact(ch) && slotsDone(ch)) parts.push(`<span class="pill purple">${reactEmoji(ch)} ${esc(reactLabel(ch))}</span>`);
  if (t && stage >= 3) parts.push(`<span class="pill lpurple">${thoughtEmoji(ch)} ${esc(t.short)}</span>`);
  if (g && stage >= 4) parts.push(`<span class="pill ${g.ask ? 'gray' : 'green'}">${g.emoji} ${esc(g.label)}</span>`);
  return `<div class="mini-chain">${parts.join('<span class="arr">→</span>')}</div>`;
}

/* =========================================================
   빈칸 복습 활동
   ========================================================= */
function clozeBlanks(id){ return CLOZE[id].parts.filter(p => typeof p !== 'string'); }
function clozeState(id){
  if (!S.cloze[id]) {
    const def = CLOZE[id];
    const words = Object.values(def.groups).flat().concat(def.distract);
    for (let i = words.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [words[i], words[j]] = [words[j], words[i]]; }
    S.cloze[id] = {words, fill:clozeBlanks(id).map(() => null), wrong:[], tries:0, status:'open'};
  }
  return S.cloze[id];
}
function clozeDone(id){ const c = S.cloze[id]; return !!c && (c.status === 'done' || c.status === 'revealed'); }
function clozeCheck(id){
  const def = CLOZE[id], c = clozeState(id), blanks = clozeBlanks(id);
  const wrong = blanks.map((b, i) => !def.groups[b.g].includes(c.words[c.fill[i]]));
  c.tries += 1;
  if (wrong.every(w => !w)) { c.status = 'done'; c.wrong = []; }
  else if (c.tries >= 3) {
    const used = {};
    c.fill = blanks.map(b => { used[b.g] = (used[b.g] || 0); const w = def.groups[b.g][used[b.g]++]; return c.words.indexOf(w); });
    c.status = 'revealed'; c.wrong = [];
  } else { c.status = 'wrong'; c.wrong = wrong; c.shake = true; }
}
function clozeHTML(id){
  const def = CLOZE[id], c = clozeState(id);
  let bi = 0;
  const locked = clozeDone(id);
  const txt = def.parts.map(p => {
    if (typeof p === 'string') return esc(p);
    const i = bi++, w = c.fill[i];
    let cls = 'cb';
    if (w != null) cls += ' filled';
    if (c.status === 'done') cls += ' ok';
    else if (c.status === 'revealed') cls += ' rev';
    else if (c.wrong[i]) cls += ' wrong' + (c.shake ? ' shk' : '');
    return `<button class="${cls}" ${locked ? 'disabled' : `data-a="clozeBlank" data-v="${id}|${i}"`}>${w != null ? esc(c.words[w]) : `${i + 1}`}</button>`;
  }).join('');
  c.shake = false;
  const usedSet = new Set(c.fill.filter(x => x != null));
  const bank = locked ? '' : `<div class="bank">${c.words.map((w, i) => `<button class="chip ${usedSet.has(i) ? 'usedw' : ''}" data-a="clozeWord" data-v="${id}|${i}">${esc(w)}</button>`).join('')}</div>`;
  const full = c.fill.every(x => x != null);
  let msg = '';
  if (c.status === 'done') msg = `<span class="cmsg good">🎉 ${esc(def.good)}</span>`;
  else if (c.status === 'revealed') msg = `<span class="cmsg rev">📖 정답을 확인하고 문장을 한 번 더 읽어 보세요.</span>`;
  else if (c.status === 'wrong') {
    msg = `<span class="cmsg bad">빨간 칸을 다시 생각해 보세요. 칸을 누르면 단어가 돌아가요.</span>`;
    if (c.tries >= 2) msg += `<span class="cmsg hint">💡 힌트: ${esc(def.hint)}</span>`;
  } else msg = `<span class="cmsg rev">단어 카드를 누르면 빈칸에 차례로 들어가요.</span>`;
  const btn = locked ? '' : `<button class="btn primary small" data-a="clozeCheck" data-v="${id}" ${full ? '' : 'disabled'}>확인</button>`;
  return `<div class="cloze"><div class="ch">✏️ 빈칸을 채워 개념을 완성해 보세요</div>
    <div class="txt">${txt}</div>${bank}
    <div class="cfoot">${btn}<div style="display:flex;flex-direction:column;gap:4px">${msg}</div></div></div>`;
}

SCREENS.domino = () => {
  const ch = curChain(), d = dom(ch), c = card(ch), t = thoughtOpt(ch), g = changeOpt(ch);
  const tiles = [{t:'src', e:d.emoji, h:'사회화 환경', l:d.name}, {t:'act', e:c.emoji, h:'경험', l:c.title}];
  if (hasReact(ch)) tiles.push({t:'rea', e:reactEmoji(ch), h:isMedia(ch) ? '인상 깊었던 모습' : '다른 사람의 반응', l:reactLabel(ch)});
  if (hasThought(ch)) tiles.push({t:'mir', e:thoughtEmoji(ch), h:'나의 생각', l:t.short});
  tiles.push({t:g.ask ? 'ask' : 'chg', e:g.emoji, h:g.ask ? '더 생각해 보기' : '나의 변화', l:g.label});
  tiles.push({t:'now', e:'🧑', h:'결과', l:'현재의 나'});
  const n = tiles.length, fall0 = .9, step = .34;
  let row = '';
  tiles.forEach((x, i) => {
    const T = TIER[x.t];
    if (i > 0) row += `<span class="darr" style="animation-delay:${(fall0 + i * step - .12).toFixed(2)}s">➜</span>`;
    row += `<div class="dom run ${T.dash ? 'dash' : ''}" style="--g:${T.c}55;border-color:${T.c};background:${T.l};animation-delay:${(i * .12).toFixed(2)}s, ${(fall0 + i * step).toFixed(2)}s">
      <span class="e">${x.e}</span><span class="t" style="color:${T.c === '#B9A3E3' ? '#8C73C8' : T.c}">${x.h}</span><span class="l">${esc(x.l)}</span></div>`;
  });
  const after = fall0 + (n - 1) * step + .6;
  const clacks = tiles.map((x, i) => `clack@${(fall0 + i * step + .33).toFixed(2)}`).join(';');
  const pop = {}; COLS_BY_DEPTH[ch.depth].forEach((col, i) => pop[`c${S.cur}n${col}`] = after + .35 + i * .14);
  const msg = g.ask
    ? '하나의 경험이 곧바로 나를 바꾸지 않을 수도 있어요. 더 생각해 보는 것도 나를 알아 가는 과정이에요.'
    : '나는 새로운 경험을 통해 이렇게 변했어요!';
  let next;
  if (S.cur === 0) next = nav(nextBtn('다른 경험 찾아보기 →', 'moreYes', null, true));
  else if (S.cur === 1) next = `<div class="more rise" style="animation-delay:${after + .6}s"><h3>경험을 하나 더 찾아볼까요?</h3>
      <div class="btns"><button class="btn primary" data-a="moreYes">네, 하나 더 찾아볼래요.</button><button class="btn soft" data-a="moreNo">이제 충분해요.</button></div></div>${nav('')}`;
  else next = `<p class="msg rise" style="animation-delay:${after + .6}s">그동안 내가 쌓은 경험들을 모두 연결해 볼까요?</p>${nav(nextBtn('나의 사회화 지도 보기 →', 'moreNo', null, true))}`;
  return `<h1 class="q center">연쇄 반응이 일어났어요!</h1>
    <div class="dominos" data-sfx="${clacks}">${row}</div>
    <div class="after" style="animation-delay:${after.toFixed(2)}s">
      <p class="msg">${msg}</p>
      ${sceneSVG(buildScene({upto:S.cur + 1}), {pop,
          steps:`${countPose(S.cur).join(',')},0;${g.ask ? 'think,think' : 'happy,happy'},${(after + .15).toFixed(2)};${countPose(S.cur + 1).join(',')},${(after + 1.5).toFixed(2)}`,
          sfx:`ding@${(after - .35).toFixed(2)}`})}
    </div>
    ${next}`;
};

/* 나의 성찰 문장 (자동 완성 두 문장) */
function sentA(){ const chs = usedChains(); const ch = chs[S.sent.a] || chs[0]; return ch ? card(ch).short : ''; }
function sentenceLines(){
  const A = sentA();
  const B = S.sent.b != null ? SENT_B[S.sent.b] : '____';
  const C = S.sent.c != null ? SENT_C[S.sent.c] : '____';
  return [
    `나는 ${A}${josa(A, '을', '를')} 통해 ${B}${S.sent.b != null ? josa(B, '을', '를') : '을(를)'} 느꼈습니다.`,
    `그 경험은 내가 ${C} 사람이라고 생각하는 데 영향을 주었습니다.`,
  ];
}
function mineLines(){ return S.mine.map(x => x.trim()).filter(Boolean); }

/* =========================================================
   참여 기록 보내기 — 반은 주소의 ?class=3 으로 구분
   학생 화면에는 아무것도 뜨지 않고, 실패해도 앱 사용에 영향 없음
   ========================================================= */
let SESSION_ID = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const CLASS_TAG = (() => {
  try {
    const q = new URLSearchParams(location.search);
    return String(q.get('class') || q.get('반') || '').replace(/[^0-9A-Za-z가-힣-]/g, '').slice(0, 10);
  } catch (e) { return ''; }
})();
let LOGGED_NAME = null;
function expSummary(ch){
  const g = changeOpt(ch);
  return `${dom(ch).name}-${card(ch).title} → ${g ? g.label : ''}`;
}
function sendLog(event){
  if (!SHEET_URL) return;
  const data = {sid:SESSION_ID, cls:CLASS_TAG, name:(S.name || '').trim(), event};
  if (event === 'finish') {
    data.exp = usedChains().map(expSummary);
    data.sentence = sentenceLines().join(' ');
    data.feel = mineLines().join(' ');
  }
  try {
    fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(data)})
      .catch(() => {});
  } catch (e) { /* 기록 실패는 무시 */ }
}

/* 자세·표정 순서 연출과 효과음 예약 */
let TIMERS = [];

      const [p, e, t] = part.split(',');
      const f = () => { el.setAttribute('data-pose', p); el.setAttribute('data-ex', e); };

/* =========================================================

    else line = t;
    // 띄어쓰기 없이 긴 문장 대비: 글자 단위로 자르기
    while (ctx.measureText(line).width > maxW) {
      let k = line.length - 1;
      while (k > 1 && ctx.measureText(line.slice(0, k)).width > maxW) k--;

  const stroke = (w, f) => { ctx.lineWidth = w; ctx.beginPath(); f(); ctx.stroke(); };

    stroke(3.5, () => { ctx.moveTo(-17, -19); ctx.quadraticCurveTo(-11, -25, -5, -20); ctx.moveTo(5, -20); ctx.quadraticCurveTo(11, -25, 17, -19); });

    stroke(3.5, () => { ctx.moveTo(-17, -15); ctx.lineTo(-6, -16); ctx.moveTo(6, -16); ctx.lineTo(17, -15); });
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-11, -4, 3.8, 0, Math.PI * 2); ctx.arc(11, -4, 3.8, 0, Math.PI * 2); ctx.fill();

  ctx.font = `27px ${EMOJI_FONT}`; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
  ctx.fillText(nd.emoji, nd.x, nd.y + 2);
  ctx.font = `700 14px ${FONT}`; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#3D3229';
  wrapLabel(nd.label, 7).forEach((ln, i) => ctx.fillText(ln, nd.x, nd.y + 49 + i * 17));
}
function drawScene(ctx, sc, ox, oy, k){
  ctx.save(); ctx.translate(ox, oy); ctx.scale(k, k);
  ctx.textAlign = 'center';
  ctx.font = `800 15px ${FONT}`; ctx.textBaseline = 'alphabetic';
  COL_HEAD.forEach((lines, i) => {
    const c = TIER[COL_TIER[i]].c;
    ctx.fillStyle = c === '#B9A3E3' ? '#8C73C8' : c;
    lines.forEach((ln, j) => ctx.fillText(ln, COLX[i], lines.length === 1 ? 64 : 53 + j * 20));
  });
  ctx.strokeStyle = '#F0E8DB'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(30, 90); ctx.lineTo(585, 90); ctx.stroke();
  sc.rows.forEach(r => {
    ctx.fillStyle = '#F4EFE7'; ctx.beginPath(); ctx.arc(22, r.y, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7A6D61'; ctx.font = `800 14px ${FONT}`; ctx.textBaseline = 'middle'; ctx.fillText(String(r.k + 1), 22, r.y + 1);
  });
  sc.edges.forEach(e => {
    ctx.strokeStyle = '#C9BEAF'; ctx.lineWidth = 3.5; ctx.setLineDash(e.dash ? [8, 7] : []);
    ctx.beginPath(); ctx.moveTo(e.sx, e.sy); ctx.lineTo(e.ex, e.ey); ctx.stroke();
    ctx.setLineDash([]);
    if (e.arrow) {
      const a = Math.atan2(e.ey - e.sy, e.ex - e.sx), L = 13;
      ctx.fillStyle = '#B7AB9C'; ctx.beginPath();
      ctx.moveTo(e.ex + Math.cos(a) * 3, e.ey + Math.sin(a) * 3);
      ctx.lineTo(e.ex - Math.cos(a - .45) * L, e.ey - Math.sin(a - .45) * L);
      ctx.lineTo(e.ex - Math.cos(a + .45) * L, e.ey - Math.sin(a + .45) * L);
      ctx.closePath(); ctx.fill();
    }
  });
  ctx.fillStyle = 'rgba(253,233,225,.8)'; ctx.beginPath(); ctx.arc(CHX, CHY + 68, 98, 0, Math.PI * 2); ctx.fill();
  drawChar(ctx, CHX, CHY, sc.pose, sc.ex, (S.name || '').trim());
  ctx.textAlign = 'center'; ctx.fillStyle = '#C3624A'; ctx.font = `800 19px ${FONT}`; ctx.textBaseline = 'alphabetic';
  ctx.fillText('현재의 나', CHX, CHY + 184);
  sc.nodes.forEach(nd => drawNode(ctx, nd));
  sc.resNodes.forEach(nd => drawNode(ctx, nd));
  ctx.restore();
}
function triggerDownload(url){
  const a = document.createElement('a');
  // 한글 파일명은 크롬에서 'download'(확장자 없음)로 바뀌므로 영문 파일명 사용
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  a.href = url; a.download = `my-identity-map-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.png`;
  document.body.appendChild(a); a.click(); a.remove();
}
function savePNG(){
  const W = 1600, MAXH = 3200, M = 70, IW = W - M * 2;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = MAXH;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#FBF6EC'; ctx.fillRect(0, 0, W, MAXH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#3D3229'; ctx.font = `800 60px ${FONT}`; ctx.fillText('나는 어떻게 만들어졌을까?', W / 2, 95);
  ctx.fillStyle = '#7A6D61'; ctx.font = `600 28px ${FONT}`; ctx.fillText('나의 사회화 지도 — 여러 경험과 상호작용이 모여 지금의 나를 이루고 있어요', W / 2, 145);
  // 지도
  const k = IW / VW, mapH = VH * k;
  let y = 180;
  ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#E8DFD0'; ctx.lineWidth = 3;
  rr(ctx, M, y, IW, mapH, 30); ctx.fill(); ctx.stroke();
  drawScene(ctx, buildScene({final:true}), M, y, k);
  y += mapH + 42;
  // 범례
  ctx.font = `600 22px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const widths = LEGEND.map(key => 32 + ctx.measureText(TIER[key].name).width + 34);
  let lx = (W - widths.reduce((a, b) => a + b, 0)) / 2;
  LEGEND.forEach((key, i) => {
    ctx.fillStyle = TIER[key].l; ctx.strokeStyle = TIER[key].c; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(lx + 10, y, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7A6D61'; ctx.fillText(TIER[key].name, lx + 30, y + 1);
    lx += widths[i];
  });
  y += 40;
  // 성찰 카드 (자동 문장 + 내가 쓴 문장)
  ctx.font = `600 31px ${FONT}`;
  const auto = []; sentenceLines().forEach(t => wrapCanvas(ctx, t, IW - 80).forEach(l => auto.push(l)));
  ctx.font = `700 29px ${FONT}`;
  const mine = []; mineLines().forEach(t => wrapCanvas(ctx, t, IW - 80).forEach(l => mine.push(l)));
  let bh = 80 + auto.length * 46 + (mine.length ? 70 + mine.length * 44 : 0);
  ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#EE8866'; ctx.lineWidth = 4;
  rr(ctx, M, y, IW, bh, 26); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#C3624A'; ctx.font = `800 25px ${FONT}`; ctx.fillText('📝 나의 사회화 성찰', M + 40, y + 44);
  ctx.fillStyle = '#3D3229'; ctx.font = `600 31px ${FONT}`;
  auto.forEach((ln, i) => ctx.fillText(ln, M + 40, y + 92 + i * 46));
  if (mine.length) {
    let my = y + 92 + auto.length * 46 - 10;
    ctx.strokeStyle = '#E8DFD0'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.moveTo(M + 40, my); ctx.lineTo(M + IW - 40, my); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#7A6D61'; ctx.font = `800 23px ${FONT}`; ctx.fillText('💬 활동 소감', M + 40, my + 38);
    ctx.fillStyle = '#5B4636'; ctx.font = `700 29px ${FONT}`;
    mine.forEach((ln, i) => ctx.fillText(ln, M + 40, my + 84 + i * 44));
  }
  y += bh + 30;
  // 사회화는 지금도 계속됩니다
  ctx.font = `700 23px ${FONT}`;
  const chips = FUTURE.map((f, i) => ({t:`${f[0]} ${f[1]}`, sel:S.future === i}));
  const cw = chips.map(c => ctx.measureText(c.t).width + 36);
  const gap = 12, rowsC = [];
  let cur = [], curW = 0;
  chips.forEach((c, i) => {
    if (cur.length && curW + gap + cw[i] > IW - 120) { rowsC.push({items:cur, w:curW}); cur = []; curW = 0; }
    curW += (cur.length ? gap : 0) + cw[i]; cur.push(i);
  });
  if (cur.length) rowsC.push({items:cur, w:curW});
  bh = 140 + rowsC.length * 58 + 90;
  ctx.fillStyle = '#FAF7F2'; ctx.strokeStyle = '#A89C8E'; ctx.lineWidth = 3; ctx.setLineDash([12, 9]);
  rr(ctx, M, y, IW, bh, 26); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#3D3229'; ctx.font = `800 31px ${FONT}`; ctx.fillText('🌱 사회화는 지금도 계속됩니다', W / 2, y + 50);
  ctx.fillStyle = '#7A6D61'; ctx.font = `700 24px ${FONT}`; ctx.fillText('🧑 현재의 나   →   앞으로의 경험   →   ❓ 새로운 나?', W / 2, y + 96);
  let cy = y + 122;
  ctx.font = `700 23px ${FONT}`;
  rowsC.forEach(r => {
    let cx = (W - r.w) / 2;
    r.items.forEach(i => {
      const c = chips[i];
      ctx.fillStyle = c.sel ? '#FDE9E1' : '#FFFFFF'; ctx.strokeStyle = c.sel ? '#EE8866' : '#E8DFD0'; ctx.lineWidth = 3;
      rr(ctx, cx, cy, cw[i], 46, 23); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#3D3229'; ctx.textBaseline = 'middle'; ctx.fillText(c.t, cx + cw[i] / 2, cy + 24);
      cx += cw[i] + gap;
    });
    cy += 58;
  });
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#7A6D61'; ctx.font = `700 24px ${FONT}`; ctx.fillText('앞으로의 경험은 나를 또 어떻게 변화시킬까요?', W / 2, cy + 22);
  ctx.fillStyle = '#5B4636'; ctx.font = `800 24px ${FONT}`; ctx.fillText('자아 정체성은 사회화를 통해 형성되며, 계속되는 사회화 과정에 따라 변할 수도 있습니다.', W / 2, cy + 62);
  y += bh + 30;
  y += 20;

  const out = document.createElement('canvas'); out.width = W; out.height = Math.ceil(y);
  out.getContext('2d').drawImage(cv, 0, 0);
  out.toBlob(blob => {
    if (!blob) { toast('이미지를 만들지 못했어요. 다시 시도해 주세요.'); return; }
    if (savePNG.lastUrl) URL.revokeObjectURL(savePNG.lastUrl);
    const url = URL.createObjectURL(blob);
    savePNG.lastUrl = url;
    triggerDownload(url);
    const m = $('modal');
    m.innerHTML = `<div class="mbox">
      <h2 style="margin:4px 0">🖼️ 이미지를 저장했어요</h2>
      <p>크롬북의 <b>파일 앱 → 다운로드</b> 폴더에 저장되었어요.<br>패들렛에서 이 이미지를 올려 주세요.</p>
      <img src="${url}" alt="나는 어떻게 만들어졌을까 결과 이미지">
      <p style="color:var(--sub);font-size:15px">저장이 안 되었다면 ‘다시 저장’을 눌러 주세요.</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:10px">
        <button class="btn soft" data-a="redownload">다시 저장</button>
        <button class="btn primary" data-a="closeModal">닫기</button>
      </div></div>`;
    m.classList.remove('hidden');
  }, 'image/png');
}

render();
</script>
